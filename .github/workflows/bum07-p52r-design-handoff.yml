name: BUM07 P5.2R design documents handoff
on:
  push:
    branches: [research/p52r-bum07-design-lock]
    paths:
      - research/p52r-bum07-design-lock/**
      - .github/workflows/bum07-p52r-design-handoff.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-design-documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify document checksums (not model or art approval)
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('research/p52r-bum07-design-lock')
          for file,expected in json.loads((root/'SHA256SUMS.json').read_text()).items():
              assert hashlib.sha256((root/file).read_bytes()).hexdigest()==expected,file
          print('Document integrity verified; P5.2R art approval and Blender authorization remain pending.')
          PY
      - name: Archive only the P5.2R design dossier
        run: |
          mkdir -p artifacts
          git archive --format=zip --output=artifacts/BUM07-P52R-DESIGN-SPEC.zip HEAD research/p52r-bum07-design-lock
          sha256sum artifacts/BUM07-P52R-DESIGN-SPEC.zip > artifacts/BUM07-P52R-DESIGN-SPEC.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: bum07-P52R-field-breeze-design-OWNER-REVIEW
          path: |
            artifacts/BUM07-P52R-DESIGN-SPEC.zip
            artifacts/BUM07-P52R-DESIGN-SPEC.zip.sha256
          if-no-files-found: error
          retention-days: 30
# Archives PNG/PDF/spec documents only. No Blender, mesh, rig, GLB,
# game tests, merge, Pages deployment, PR2 changes or Supabase access.
