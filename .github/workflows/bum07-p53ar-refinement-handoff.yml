name: BUM07 P5.3A-R Blender refinement dossier handoff
on:
  push:
    branches: [research/p53ar-bum07-refinement]
    paths:
      - research/p53ar-bum07-refinement/**
      - .github/workflows/bum07-p53ar-refinement-handoff.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-design-documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify dossier checksums (not model or art approval)
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('research/p53ar-bum07-refinement')
          for file,expected in json.loads((root/'SHA256SUMS.json').read_text()).items():
              assert hashlib.sha256((root/file).read_bytes()).hexdigest()==expected,file
          print('Dossier integrity verified; P5.3A-R art approval and P5.3B authorization remain pending.')
          PY
      - name: Archive only the P5.3A-R refinement dossier
        run: |
          mkdir -p artifacts
          git archive --format=zip --output=artifacts/BUM07-P53AR-REFINEMENT.zip HEAD research/p53ar-bum07-refinement
          sha256sum artifacts/BUM07-P53AR-REFINEMENT.zip > artifacts/BUM07-P53AR-REFINEMENT.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: bum07-P53AR-field-breeze-refinement-OWNER-REVIEW
          path: |
            artifacts/BUM07-P53AR-REFINEMENT.zip
            artifacts/BUM07-P53AR-REFINEMENT.zip.sha256
          if-no-files-found: error
          retention-days: 30
# Archives the saved blockout, renders and review dossier only.
# No rig/GLB/game tests, merge, Pages deployment, PR2 changes or Supabase access.
