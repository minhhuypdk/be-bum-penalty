<text x="100" y="935" font-size="22">Skull width0.74H; eye centers ±0.16H; mouth neutral0.34H.</text>
<text x="100" y="977" font-size="22">Dashed circles = proposed globe diameter0.22H, not exposed eyeball outlines.</text>
<text x="100" y="1019" font-size="22">Opening0.19H; iris0.10H; lid rim0.008–0.012H. Lid must wrap globe, not float.</text>
<text x="850" y="190" font-size="27">Construction contract</text>
<text x="850" y="245" font-size="22">1. Shape skull + soft oval cheeks before skin detail.</text>
<text x="850" y="300" font-size="22">2. Keep globe centers / radius fixed across expressions.</text>
<text x="850" y="355" font-size="22">3. Continuous upper/lower lids + anchored canthi.</text>
<text x="850" y="410" font-size="22">4. Upper-lid travel dominates Blink; no globe shrink.</text>
<text x="850" y="465" font-size="22">5. Real lip volume / corners / inner mouth cavity.</text>
<text x="850" y="520" font-size="22">6. Stable tooth arches; jaw carries lower teeth.</text>
<text x="850" y="575" font-size="22">7. Smile cheeks lift lower lids; preserve identity.</text>
<text x="850" y="630" font-size="22">8. Skin, eye, mouth clearance must be tested later.</text>
<text x="850" y="740" font-size="24">Not an orthographic mesh measurement or rig test.</text>
<text x="850" y="800" font-size="22">Skull depth0.78H; no large exposed white eye rim.</text>
<text x="850" y="855" font-size="22">No flat line smile / tubular iris patches / hair cap.</text>
</svg>