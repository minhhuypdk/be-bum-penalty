<text x="40" y="50" font-size="30">BUM07 B — PROPOSED FACE / SOCKET / LID CONSTRUCTION</text>
<text x="40" y="88" font-size="22">H dimensions are design proposals. No mesh or rig exists; diagram is not Scott topology.</text>
